# Dark Shelf -> offline Android APK, built entirely on GitHub.
#
# Repo layout needed (upload from your phone, nothing else):
#   dark-shelf-v2.zip            <- the Lovable export, in the repo root
#   .github/workflows/build.yml  <- this file
#
# Run: Actions tab -> "Build Dark Shelf APK" -> Run workflow.
# Result: a Release (Releases section of the repo) with the APK attached, plus a workflow artifact.
#
# Optional signing (so future builds install as updates and keep your data):
#   Option A: add repo secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#             (and optionally ANDROID_KEY_PASSWORD)
#   Option B: put a keystore at release-keystore/android.keystore in the repo and add the
#             ANDROID_KEYSTORE_PASSWORD + ANDROID_KEY_ALIAS secrets.
# With neither, a debug-signed APK is built (installs fine; uninstall the old one before updating).

name: Build Dark Shelf APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: dark-shelf-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Unzip the Lovable export
        run: |
          set -euo pipefail
          ZIP="$(ls -1 ./*.zip 2>/dev/null | head -n1 || true)"
          [ -n "$ZIP" ] || { echo "::error::No .zip found in the repo root. Upload dark-shelf-v2.zip there."; exit 1; }
          echo "Using $ZIP"
          rm -rf "$RUNNER_TEMP/unz" app
          mkdir -p "$RUNNER_TEMP/unz"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/unz"
          PKG="$(find "$RUNNER_TEMP/unz" -name package.json -not -path '*/node_modules/*' | head -n1)"
          [ -n "$PKG" ] || { echo "::error::package.json not found inside the zip."; exit 1; }
          mv "$(dirname "$PKG")" app
          ls -la app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: app
        run: bun run test

      - name: Build static app
        working-directory: app
        run: bun run build:static

      - name: Check static output
        working-directory: app
        run: |
          test -f dist/client/index.html || { echo "::error::dist/client/index.html was not generated"; exit 1; }
          ls -la dist/client

      - name: Work out version
        id: version
        run: |
          echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project (Capacitor)
        working-directory: app
        run: |
          rm -rf android
          npx cap add android

      - name: Apply black theme, icons and version
        working-directory: app
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: node scripts/prepare-android.mjs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and sign APK
        working-directory: app/android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p ../../apk-out
          OUT="$GITHUB_WORKSPACE/apk-out"

          KS=""
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KS="$RUNNER_TEMP/release.jks"
          elif [ -f "$GITHUB_WORKSPACE/release-keystore/android.keystore" ]; then
            KS="$GITHUB_WORKSPACE/release-keystore/android.keystore"
          fi

          if [ -n "$KS" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "Building SIGNED release APK"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            ./gradlew --no-daemon assembleRelease
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$KS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass pass:"$KEY_PASS" \
              --out "$OUT/dark-shelf-${VERSION_NAME}.apk" \
              "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "$OUT/dark-shelf-${VERSION_NAME}.apk"
          else
            echo "::warning::No signing keystore found, building a debug-signed APK."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT/dark-shelf-${VERSION_NAME}-debug.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"
          ls -la "$OUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dark-shelf-apk-${{ steps.version.outputs.name }}
          path: apk-out/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dark-shelf-v${{ steps.version.outputs.name }}
          name: Dark Shelf ${{ steps.version.outputs.name }}
          files: apk-out/*.apk
          make_latest: true

