# One-time helper: generates a NEW signing keystore on GitHub and hands it to you as a
# downloadable artifact. Nothing is written to the repo and the password is never printed in the log.
#
# Run: Actions tab -> "Generate Dark Shelf keystore" -> Run workflow.
# Then open the finished run -> Artifacts -> download "dark-shelf-keystore" (a zip), unzip it, and:
#   1. Save dark-shelf-release.keystore + keystore-details.txt somewhere safe.
#   2. Put the secrets (see keystore-details.txt) into Settings > Secrets and variables > Actions.
#   3. DELETE the workflow run (open the run -> ... menu -> Delete workflow run) so the artifact is gone.
# The artifact auto-deletes after 1 day anyway. In a public repo, do these steps promptly.

name: Generate Dark Shelf keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate keystore
        run: |
          set -euo pipefail
          mkdir -p out
          PASS="$(openssl rand -hex 12)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore out/dark-shelf-release.keystore -storetype PKCS12 \
            -alias darkshelf -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Dark Shelf, O=Priyam Rai, C=IN"
          keytool -list -keystore out/dark-shelf-release.keystore -storepass "$PASS" | grep -q PrivateKeyEntry
          base64 -w0 out/dark-shelf-release.keystore > out/keystore-base64.txt
          {
            echo "Dark Shelf signing details (keep private, never share or commit)"
            echo
            echo "Keystore file:  dark-shelf-release.keystore"
            echo "Alias:          darkshelf"
            echo "Password:       $PASS"
            echo
            echo "GitHub repo secrets to create:"
            echo "  ANDROID_KEYSTORE_BASE64    = entire contents of keystore-base64.txt"
            echo "  ANDROID_KEYSTORE_PASSWORD  = the password above"
            echo "  ANDROID_KEY_ALIAS          = darkshelf"
          } > out/keystore-details.txt
          ls -la out

      - name: Upload keystore (kept 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: dark-shelf-keystore
          path: out/
          retention-days: 1
          if-no-files-found: error
